<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVC-AI Coach</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: auto; padding: 20px; }
        #chat-form { display: flex; margin-bottom: 20px; }
        #chat-input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        #send-button { padding: 10px 15px; margin-left: 10px; border: none; background-color: #007bff; color: white; border-radius: 5px; cursor: pointer; }
        #response-container { background-color: #f0f0f0; padding: 15px; border-radius: 5px; min-height: 50px; white-space: pre-wrap; }
        #status { margin-top: 10px; color: #888; }
    </style>
</head>
<body>
    <h1>NVC-AI Coach</h1>
    <form id="chat-form">
        <input type="text" id="chat-input" placeholder="Type your message here..." required>
        <button type="submit" id="send-button">Send</button>
    </form>
    <div id="response-container"></div>
    <div id="status"></div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const responseContainer = document.getElementById('response-container');
        const statusDiv = document.getElementById('status');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = chatInput.value.trim();
            if (!message) return;

            // Clear previous response and set status
            responseContainer.textContent = '';
            statusDiv.textContent = 'Thinking...';
            chatInput.disabled = true;
            document.getElementById('send-button').disabled = true;

            try {
                const response = await fetch('http://localhost:8080/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: 'web-client-user', // A static user_id for this simple client
                        text: message,
                    }),
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`HTTP error! status: ${response.status}, detail: ${errorData.detail}`);
                }

                const data = await response.json();
                responseContainer.textContent = data.ai_message;
                statusDiv.textContent = ''; // Clear status

            } catch (error) {
                console.error('Error:', error);
                responseContainer.textContent = 'Sorry, something went wrong. Please check the console for details.';
                statusDiv.textContent = `Error: ${error.message}`;
            } finally {
                // Re-enable form
                chatInput.disabled = false;
                document.getElementById('send-button').disabled = false;
                chatInput.value = ''; // Clear input field
            }
        });
    </script>
</body>
</html>
